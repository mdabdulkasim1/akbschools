<style>
/* ===== AKB Fee Collection — styles ===== */
:root{
  --bg:#0f172a; --surface:#ffffff; --muted:#64748b; --text:#0f172a;
  --border:#e2e8f0; --primary:#1d4ed8; --primary-d:#1e40af; --primary-l:#eff6ff;
  --green:#059669; --green-l:#ecfdf5; --red:#dc2626; --red-l:#fef2f2;
  --amber:#d97706; --amber-l:#fffbeb; --sidebar:#0f172a; --sidebar-hover:#1e293b;
  --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  --shadow-lg:0 10px 30px rgba(15,23,42,.15);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',Roboto,Arial,system-ui,sans-serif;color:var(--text);background:#f1f5f9;font-size:14px}
a{color:inherit;text-decoration:none}
button{font-family:inherit}

#app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:230px;background:var(--sidebar);color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid #1e293b}
.brand-logo{width:42px;height:42px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:3px;flex:0 0 auto}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{color:#fff;font-size:15px}
.brand-text span{font-size:11px;color:#94a3b8}
.nav{display:flex;flex-direction:column;padding:12px 8px;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;color:#cbd5e1;font-weight:500;transition:background .15s,color .15s}
.nav a .ico{font-size:16px;width:20px;text-align:center}
.nav a:hover{background:var(--sidebar-hover);color:#fff}
.nav a.active{background:var(--primary);color:#fff}
.sidebar-foot{padding:14px 16px;border-top:1px solid #1e293b}
.year-badge{font-size:11px;color:#94a3b8}
.sync-badge{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;margin-bottom:10px;padding:5px 9px;border-radius:8px;line-height:1.3}
.sync-badge .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.sync-badge.ok{color:#bbf7d0;background:rgba(22,163,74,.15)}
.sync-badge.ok .dot{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.sync-badge.saving{color:#fde68a;background:rgba(217,119,6,.15)}
.sync-badge.saving .dot{background:#f59e0b;animation:syncpulse 1s ease-in-out infinite}
.sync-badge.offline{color:#fecaca;background:rgba(220,38,38,.15)}
.sync-badge.offline .dot{background:#ef4444}
@keyframes syncpulse{0%,100%{opacity:1}50%{opacity:.3}}
.db-status.ok{color:var(--green)}
.db-status.saving{color:var(--amber,#f59e0b)}
.db-status.offline{color:var(--red)}

/* Main */
.main{flex:1;margin-left:230px;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 20px}
.hamburger{display:none;background:none;border:none;font-size:20px;cursor:pointer}
.search-wrap{position:relative;flex:1;max-width:460px}
.search-wrap input{width:100%;padding:9px 14px;border:1px solid var(--border);border-radius:20px;font-size:14px;background:#f8fafc}
.search-wrap input:focus{outline:none;border-color:var(--primary);background:#fff}
.search-results{position:absolute;top:110%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;display:none;z-index:50}
.search-results.open{display:block}
.search-results .sr-item{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #f1f5f9}
.search-results .sr-item:hover{background:var(--primary-l)}
.search-results .sr-item .sr-bal{font-weight:600}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.db-status{color:var(--green);font-size:12px}
.view{padding:22px;max-width:1280px;width:100%;margin:0 auto}

/* Page header */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;margin:0}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.card .v{font-size:24px;font-weight:700;margin-top:6px}
.card .sub{font-size:12px;color:var(--muted);margin-top:4px}
.card.accent-green{border-left:4px solid var(--green)}
.card.accent-red{border-left:4px solid var(--red)}
.card.accent-blue{border-left:4px solid var(--primary)}
.card.accent-amber{border-left:4px solid var(--amber)}

/* Panels */
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:15px;margin:0}
.panel-body{padding:6px 0}
.panel-body.pad{padding:18px}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:11px 16px;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);background:#f8fafc;position:sticky;top:0}
tbody td{padding:11px 16px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tbody tr:hover{background:#f8fafc}
tbody tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.table-scroll{overflow:auto;max-height:none}
.t-right{ text-align:right }
.t-center{ text-align:center }

/* Badges & pills */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge.green{background:var(--green-l);color:var(--green)}
.badge.red{background:var(--red-l);color:var(--red)}
.badge.amber{background:var(--amber-l);color:var(--amber)}
.badge.blue{background:var(--primary-l);color:var(--primary)}
.badge.gray{background:#f1f5f9;color:var(--muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:600;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{filter:brightness(.95)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.wa:hover{background:#1ebe5b}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:#334155}
.field input,.field select,.field textarea{padding:9px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;background:#fff}

/* Filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow:auto}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:pop .15s ease}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:17px}
.modal-body{padding:20px;max-height:70vh;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.x-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}

/* Fee head rows in payment modal */
.fee-row{display:grid;grid-template-columns:24px 1.4fr 1fr 1fr;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}
.fee-row .fh-label{font-weight:600}
.fee-row .fh-bal{color:var(--red);font-weight:600;text-align:right}
.fee-row input{padding:7px 10px;border:1px solid var(--border);border-radius:8px;text-align:right}
.fee-row.paidoff .fh-bal{color:var(--green)}
.fee-group{border:1px solid var(--border);border-radius:10px;padding:4px 12px;margin:8px 0;background:#fff7ed}
.fee-group-hd{font-weight:700;font-size:13px;color:#c2410c;padding:6px 0}
.fee-group .fee-row{border-bottom:1px solid #fde8d3}
.fee-group .fee-row:last-child{border-bottom:none}
/* brief highlight when jumping to a panel */
@keyframes panelFlash{0%{box-shadow:0 0 0 0 rgba(29,78,216,.45)}100%{box-shadow:0 0 0 6px rgba(29,78,216,0)}}
.panel.flash{animation:panelFlash 1.2s ease-out;border-color:var(--primary)}

/* Student detail */
.detail-grid{display:grid;grid-template-columns:320px 1fr;gap:20px}
.detail-grid.chair{grid-template-columns:1.5fr 1fr}
.info-list{display:flex;flex-direction:column}
.info-list .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.info-list .row .lbl{color:var(--muted)}
.info-list .row .val{font-weight:600;text-align:right}
.avatar{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;overflow:hidden;flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover}
/* Student photo */
.student-photo-box{width:130px;height:150px;margin:0 auto 14px;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f8fafc}
.student-photo-box img{width:100%;height:100%;object-fit:cover}
.photo-edit{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.photo-box{width:92px;height:108px;border:1px dashed var(--border);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f8fafc;flex:0 0 auto}
.photo-box img{width:100%;height:100%;object-fit:cover}

/* Progress bar */
.progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden}
.progress > span{display:block;height:100%;background:var(--green);border-radius:20px}

/* Misc */
.empty{padding:40px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.flex{display:flex}.gap{gap:10px}.mt{margin-top:14px}.wrap{flex-wrap:wrap}
.hidden{display:none!important}
.pill-mode{font-size:11px;padding:2px 8px;border-radius:6px;background:#f1f5f9;font-weight:600}

/* Toast */
.toast-root{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;animation:pop .15s ease}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* Responsive */
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .hamburger{display:block}
  .detail-grid{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
}

/* ===== Login screen ===== */
.login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1e3a8a,#0f172a);padding:20px;z-index:120}
.login-card{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:380px;padding:32px 30px;text-align:center;animation:pop .2s ease}
.login-logo{width:96px;height:96px;border-radius:16px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.12);display:flex;align-items:center;justify-content:center;padding:8px;margin:0 auto 14px}
.login-logo img{width:100%;height:100%;object-fit:contain}
.login-card h1{margin:0;font-size:22px}
.login-card p{margin:2px 0 18px}
.login-card .field{text-align:left}
.login-card input{width:100%}
.pw-wrap{position:relative}
.pw-wrap input{width:100%;padding-right:44px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;line-height:1;padding:6px;opacity:.65}
.pw-eye:hover{opacity:1}
.login-err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:8px;text-align:left}
.login-hint{margin-top:16px;font-size:11px;line-height:1.6}
.login-hint code{background:#f1f5f9;padding:1px 5px;border-radius:4px}

/* ===== Sidebar user box ===== */
.user-box{margin-bottom:12px}
.user-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.user-ava{width:34px;height:34px;border-radius:9px;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.user-meta{display:flex;flex-direction:column;line-height:1.3}
.user-meta strong{color:#fff;font-size:13px}
.user-actions{display:flex;gap:6px}
.user-actions .btn{background:#1e293b;border-color:#334155;color:#cbd5e1;flex:1;justify-content:center}
.user-actions .btn:hover{background:#334155;color:#fff}

/* ===== Chart legend ===== */
.chart-legend{display:flex;gap:18px;justify-content:center;margin-top:8px;font-size:12px;color:var(--muted)}
.chart-legend span{display:flex;align-items:center;gap:6px}
.chart-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ===== Edit modal sections ===== */
h4.sec{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:5px}
h4.sec:first-child{margin-top:0}
.fee-head-hdr{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 0 4px}
.fee-head-hdr span:not(:first-child){text-align:right}

/* ===== Teacher module: attendance, report cards, academics ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.grid-2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld > span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.fld input,.fld select{padding:8px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;background:#fff}
.sel-inline{padding:4px 8px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:#fff}
.chk-grid{display:flex;flex-wrap:wrap;gap:8px 16px}
.chk-inline{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
.chk-inline input{margin:0}

/* attendance toggle */
.att-toggle{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.att-btn{border:none;background:#fff;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.att-btn.p.on{background:var(--green);color:#fff}
.att-btn.a.on{background:var(--red);color:#fff}
.att-btn:not(.on):hover{background:#f1f5f9}
.att-btn + .att-btn{border-left:1px solid var(--border)}
tr.row-absent{background:var(--red-l)}

/* marks grid */
.marks-grid td,.marks-grid th{padding:6px 8px}
.marks-grid tr.grp-row td{background:#f1f5f9;font-weight:700;color:#334155;font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.mk-sel{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-weight:600;background:#fff;min-width:56px}
.scale-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin-bottom:12px}
.scale-legend b{font-size:13px}

/* horizontal bars */
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar-row{display:grid;grid-template-columns:120px 1fr 90px;align-items:center;gap:12px}
.hbar-lbl{font-size:13px;font-weight:600;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{height:14px;background:#eef2f7;border-radius:20px;overflow:hidden}
.hbar-track > span{display:block;height:100%;border-radius:20px}
.hbar-val{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* sub-tabs (Academics / Attendance report) */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.subtab{border:none;background:none;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab:hover{color:var(--text)}
.subtab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.donut-legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.donut-legend span{display:flex;align-items:center;gap:8px}
.donut-legend i{width:13px;height:13px;border-radius:3px;display:inline-block}

/* ===== Print (receipt) — A5 pages, no browser header/footer ===== */
/* margin:0 removes Chrome's auto date/title/URL/page-number in the margins */
@page{ size:A5; margin:0; }
@media print{
  html,body{overflow:hidden!important;background:#fff;margin:0!important;padding:0!important;width:148mm}
  #toastRoot,#authRoot,.no-print{display:none!important}
  .sidebar,.topbar{display:none!important}
  .main{margin:0!important}
  .view{padding:0;max-width:none}
  /* When a receipt is open, print ONLY the receipt — hide the page behind it */
  body.receipt-open #app{display:none!important}
  .modal-backdrop{position:static;background:none;padding:0;margin:0;display:block}
  .modal{box-shadow:none;max-width:none;width:auto;margin:0;border:none;background:none}
  .modal-body{padding:0!important;overflow:visible!important}
  .modal-head,.modal-foot{display:none!important}
  /* one receipt per A5 page, edge-to-edge with a small inner padding */
  .receipt{box-shadow:none!important;border:none!important;border-radius:0!important;
    width:148mm!important;max-width:148mm!important;min-height:207mm;margin:0!important;
    padding:10mm 12mm!important;box-sizing:border-box;page-break-after:always}
  .receipt:last-child{page-break-after:auto}
}

/* KPI cards are clickable */
.card.link{cursor:pointer;transition:transform .1s,box-shadow .1s}
.card.link:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.biz-logo{height:26px;width:auto;vertical-align:middle;margin-right:8px}
.biz-head{display:flex;align-items:center;gap:8px}

</style>
<div id="app">

/* ===== AKB Fee Collection — utilities ===== */
(function (w) {
  'use strict';

  // Indian-format currency (no decimals for whole rupees)
  function inr(n) {
    n = Number(n) || 0;
    const neg = n < 0;
    n = Math.round(Math.abs(n));
    const s = n.toString();
    let last3 = s.slice(-3);
    let rest = s.slice(0, -3);
    if (rest) last3 = ',' + last3;
    rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    return (neg ? '-₹' : '₹') + rest + last3;
  }
  // plain number with Indian grouping, no symbol
  function inum(n) { return inr(n).replace('₹', '').replace('-', '-'); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function initials(name) {
    if (!name) return '?';
    const parts = String(name).trim().split(/[\s.]+/).filter(Boolean);
    return ((parts[0] || '')[0] || '' ).toUpperCase() + ((parts[1] || '')[0] || '').toUpperCase();
  }

  function todayISO() {
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // Rupees in words (Indian system) — for receipts
  function inWords(num) {
    num = Math.round(Number(num) || 0);
    if (num === 0) return 'Zero Rupees Only';
    const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
      'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    function two(n) { return n < 20 ? a[n] : b[Math.floor(n / 10)] + (n % 10 ? ' ' + a[n % 10] : ''); }
    function three(n) { return (n >= 100 ? a[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + two(n % 100) : '') : two(n)); }
    let out = '';
    const crore = Math.floor(num / 10000000); num %= 10000000;
    const lakh = Math.floor(num / 100000); num %= 100000;
    const thou = Math.floor(num / 1000); num %= 1000;
    const hun = num;
    if (crore) out += three(crore) + ' Crore ';
    if (lakh) out += two(lakh) + ' Lakh ';
    if (thou) out += two(thou) + ' Thousand ';
    if (hun) out += three(hun) + ' ';
    return out.trim() + ' Rupees Only';
  }

  function debounce(fn, ms) {
    let t; return function () { clearTimeout(t); const args = arguments, ctx = this; t = setTimeout(() => fn.apply(ctx, args), ms); };
  }

  // Read an image File, downscale it, and return a compact JPEG data URI.
  function imageToDataURL(file, maxDim) {
    return new Promise((resolve, reject) => {
      if (!file) return resolve('');
      const rd = new FileReader();
      rd.onerror = () => reject(new Error('Could not read file'));
      rd.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('Not a valid image'));
        img.onload = () => {
          const M = maxDim || 320;
          let w = img.width, h = img.height;
          const scale = Math.min(1, M / Math.max(w, h));
          w = Math.max(1, Math.round(w * scale)); h = Math.max(1, Math.round(h * scale));
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          try { resolve(c.toDataURL('image/jpeg', 0.85)); }
          catch (e) { resolve(rd.result); } // fallback to original if tainted
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  function download(filename, content, type) {
    const blob = new Blob([content], { type: type || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
  }

  // Parse CSV text into an array of row-arrays (handles quotes, commas, newlines)
  function fromCSV(text) {
    const rows = []; let cur = [], field = '', inq = false;
    text = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inq) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inq = false; }
        else field += c;
      } else {
        if (c === '"') inq = true;
        else if (c === ',') { cur.push(field); field = ''; }
        else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; }
        else field += c;
      }
    }
    cur.push(field); rows.push(cur);
    return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));
  }

  function toCSV(rows) {
    return rows.map(r => r.map(c => {
      c = c == null ? '' : String(c);
      return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
    }).join(',')).join('\r\n');
  }

  // Normalise an Indian mobile to international digits (no +). Default CC 91.
  function normalizePhone(num, cc) {
    cc = cc || '91';
    let d = String(num == null ? '' : num).replace(/\D/g, '');
    if (!d) return '';
    if (d.length > 10 && d.indexOf(cc) === 0) return d;   // already has country code
    if (d.length === 11 && d[0] === '0') d = d.slice(1);   // drop leading 0
    if (d.length === 10) return cc + d;
    return d;
  }
  function waLink(num, text, cc) {
    const n = normalizePhone(num, cc);
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent(text || '');
  }
  function smsLink(num, text, cc) {
    const n = normalizePhone(num, cc);
    return 'sms:' + (n ? '+' + n : '') + '?body=' + encodeURIComponent(text || '');
  }

  function toast(msg, kind) {
    const root = document.getElementById('toastRoot');
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2600);
    setTimeout(() => el.remove(), 3000);
  }

  function uid() {
    return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  w.U = { inr, inum, esc, initials, todayISO, fmtDate, inWords, debounce, download, toCSV, fromCSV, imageToDataURL, normalizePhone, waLink, smsLink, toast, uid };
})(window);

  function isKG(grade) { return /KG\b|KINDER/i.test(String(grade || '')); }

  /* ---- Roles & page-level access ----
   * PAGES are the dashboard "topics" an admin can grant per user (matching the
   * sidebar). ROLES are labels/groupings; each has a DEFAULT set of pages, but
   * the admin can override any user's access with a custom `pages` list

  const PAGES = [

  const FINANCIAL_PAGES = ['collect', 'collections', 'expenses'];
  function roleCanCollect(role) { return role === 'admin' || role === 'account'; }
  // Pages that may be offered to a role in the access picker (hide money pages
  // for roles that can never collect).
  function pageListFor(role) { return PAGES.filter(p => FINANCIAL_PAGES.indexOf(p.key) < 0 || roleCanCollect(role)); }
  const ROLES = [

  // Sensible starting page-set for each role (admin => everything).
  const DEFAULT_PAGES = {

  function normRole(role) { return ROLE_KEYS.indexOf(role) >= 0 ? role : 'account'; }
  function defaultPagesFor(role) { return (DEFAULT_PAGES[normRole(role)] || DEFAULT_PAGES.account).slice(); }
  // Effective pages for a user record: admin => all; explicit list wins; else role default.
  function effectivePages(u) {
    if (!u) return [];
    if (u.role === 'admin') return PAGE_KEYS.slice();
    let list = Array.isArray(u.pages) ? u.pages.filter(k => PAGE_KEYS.indexOf(k) >= 0) : defaultPagesFor(u.role);
    // Money pages never apply to a role that can't collect (defence in depth).
    if (!roleCanCollect(u.role)) list = list.filter(k => FINANCIAL_PAGES.indexOf(k) < 0);
    return list;
  }

  /* ---- Expenses ----

  ];
  function slugKey(s) { return String(s || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || ('c' + Date.now()); }

  // Expense SUB-CATEGORIES: the specific bill item/purpose the account picks
  // (e.g. PETROL, BOOKS, SALARY). A flat, admin-editable list; account entries
  // may also add a new one on the fly. Stored in meta.expenseItems.
