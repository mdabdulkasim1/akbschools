<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AKB SCHOOLS — Operations</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/logo-school.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="assets/img/logo-school.svg" alt="AKB School of Excellence" /></div>
        <div class="brand-text">
          <strong>AKB SCHOOLS</strong>
          <span>Operations</span>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard" data-roles="admin account"><span class="ico">📊</span> Dashboard</a>
        <a href="#/students" data-route="students" data-roles="admin account"><span class="ico">👨‍🎓</span> Students</a>
        <a href="#/collect" data-route="collect" data-roles="admin account"><span class="ico">🧾</span> Receive Payment</a>
        <a href="#/collections" data-route="collections" data-roles="admin account"><span class="ico">💵</span> Collections</a>
        <a href="#/expenses" data-route="expenses" data-roles="admin account"><span class="ico">💸</span> Expenses</a>
        <a href="#/reports" data-route="reports" data-roles="admin account"><span class="ico">📈</span> Reports</a>
        <a href="#/attendance" data-route="attendance" data-roles="admin teacher"><span class="ico">📝</span> Attendance</a>
        <a href="#/attreport" data-route="attreport" data-roles="admin"><span class="ico">📅</span> Attendance Report</a>
        <a href="#/marks" data-route="marks" data-roles="admin teacher"><span class="ico">📚</span> Report Cards</a>
        <a href="#/academics" data-route="academics" data-roles="admin"><span class="ico">🎓</span> Academics</a>
        <a href="#/users" data-route="users" data-roles="admin"><span class="ico">👥</span> Users</a>
        <a href="#/data" data-route="data" data-roles="admin"><span class="ico">⚙️</span> Data &amp; Backup</a>
      </nav>
      <div class="sidebar-foot">
        <div id="syncBadge" class="sync-badge" title="Connection to the shared server (all devices)"></div>
        <div class="user-box" id="userBox"></div>
        <div id="yearBadge" class="year-badge"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
        <div class="search-wrap">
          <input id="globalSearch" type="search" placeholder="Search student by name or ID…" autocomplete="off" />
          <div id="searchResults" class="search-results"></div>
        </div>
        <div class="topbar-right">
          <span id="dbStatus" class="db-status">●</span>
        </div>
      </header>
      <main id="view" class="view"><!-- rendered by router --></main>
    </div>
  </div>

  <div id="authRoot"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <!-- Seed data (embedded so the app runs from file:// with no server) -->
  <script src="data/seed.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/receipt.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
