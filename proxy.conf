# Apache Proxy Configuration for akbschools.akbgroups.com
# Location on server: /etc/apache2/conf.d/userdata/ssl/2_4/akbgroups/akbschools.akbgroups.com/proxy.conf

<IfModule mod_proxy.c>
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3021/
    ProxyPassReverse / http://127.0.0.1:3021/
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
</IfModule>
